<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <title>Kaverilista</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

        <h1>Kaverilista</h1>
    </div>

    <form id="kaveriForm">

    </form>

    <div id="nimet"></div>

    <script src="main.js"></script>

</body>
</html>
